name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these; nothing else does.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue rather than cancel, so a green commit is
# always what ends up published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The deploy is gated on a green build. Publishing a broken scheduler
      # would be worse than publishing nothing.
      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Check content files
        run: npm run content:check

      # The browser tests need a browser. Chromium only - see
      # playwright.config.ts for why one is enough for this app.
      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      # Catches what jsdom cannot: a real session writing to real IndexedDB,
      # and a real reload reading it back. Retries are configured, so a flaky
      # browser cannot be the reason a good commit fails to publish.
      - name: Browser tests
        run: npm run e2e

      - name: Build
        run: npm run build
        env:
          # Switches Vite to the /takeroot/ base path that Pages serves from.
          GITHUB_PAGES: 'true'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
